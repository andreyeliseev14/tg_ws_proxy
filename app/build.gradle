plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'ru.tgws.proxy'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.tgws.proxy'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Постоянный ключ подписи: новые сборки ставятся поверх старых без удаления
    signingConfigs {
        fixed {
            storeFile file('tgws.keystore')
            storePassword 'tgwsproxy'
            keyAlias 'tgws'
            keyPassword 'tgwsproxy'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "httpx[http2]==0.28.1"
            install "certifi"
        }
    }
}
