name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch TG WS Proxy core (Flowseal)
        run: |
          git clone --depth 1 https://github.com/Flowseal/tg-ws-proxy /tmp/core
          rm -rf app/src/main/python/proxy
          cp -r /tmp/core/proxy app/src/main/python/proxy
          mkdir -p app/src/main/assets
          cp /tmp/core/LICENSE app/src/main/assets/FLOWSEAL_LICENSE.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TgWsProxy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-apk
          path: TgWsProxy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TG WS Proxy (сборка ${{ github.run_number }})
          files: TgWsProxy.apk
